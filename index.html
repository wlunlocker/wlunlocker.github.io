<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WLUnlocker</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --bg-start: #060912;
            --bg-end: #0f172a;
            --card: #161a22;
            --accent: #007aff;
            --text-main: #f0f0f0;
            --text-sub: #b0b0b0;
            --green-pill: rgba(0, 255, 65, 0.1);
            --green-text: #00ff41;
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #050811, #0a1322, #0f172a, #050811);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .telegram-pill {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--green-pill);
            border-radius: 25px;
            color: var(--green-text);
            font-size: 0.95em;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }

        .telegram-pill:hover {
            background-color: rgba(0, 255, 65, 0.2);
            transform: scale(1.02);
        }

        .last-upd-box {
            font-family: monospace;
            font-size: 0.85em;
            color: #888;
            margin-top: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .section {
            background-color: var(--card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #2a2f3a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h2 {
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            font-size: 0.95em;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            color: var(--text-sub);
        }

        .item-card {
            background-color: #1c212b;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid #2a2f3a;
        }

        .item-card:last-child { margin-bottom: 0; }

        .sub-item .item-title {
            color: var(--accent);
            font-weight: 800;
            font-size: 1.1em;
            margin-bottom: 8px;
            display: block;
        }

        .proxy-item .item-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 8px;
            display: block;
        }

        .item-info {
            font-size: 0.85em;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 18px;
            white-space: pre-line;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95em;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn-accent {
            background-color: var(--accent);
            color: white;
        }

        .btn-accent:hover {
            background-color: #0063d1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
        }
        
        .btn-secondary {
            background-color: #2a2f3a;
            color: var(--text-main);
        }
        
        .btn-secondary:hover {
            background-color: #3a4150;
        }

        .material-icons-outlined {
            font-size: 20px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2em; }
            .section { padding: 18px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>WLUnlocker</h1>
        <a href="https://t.me/wlunlocker" class="telegram-pill">
            Больше в Telegram-канале @wlunlocker
        </a>
        <div id="update-info" class="last-upd-box">Синхронизация...</div>
    </div>

    <div class="container">
        <div class="section">
            <h2>
                <span class="material-icons-outlined" style="margin-right:8px;color:var(--accent);">auto_awesome</span>
                ПОДКЛЮЧИТЬ (V2RAY/HIDDIFY/HAPP)
            </h2>
            <div id="sub-list"></div>
        </div>

        <div class="section">
            <h2>
                <span class="material-icons-outlined" style="margin-right:8px;color:var(--accent);">bolt</span>
                MTProto Прокси (Telegram)
            </h2>
            <div id="proxy-list"></div>
        </div>
    </div>

    <script>
        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btnElement.innerHTML;
                btnElement.innerHTML = '<span class="material-icons-outlined">check_circle</span> Скопировано!';
                btnElement.style.backgroundColor = '#28a745';
                setTimeout(() => {
                    btnElement.innerHTML = original;
                    btnElement.style.backgroundColor = '';
                }, 2000);
            });
        }

        async function fetchData() {
            const cacheBuster = '?v=' + Math.random();
            try {
                // 1. Дата
                const vpnResp = await fetch('https://raw.githubusercontent.com/wlunlocker/anti-rkn/main/vpnfull.txt' + cacheBuster);
                const vpnText = await vpnResp.text();
                const dateLine = vpnText.split('\n').find(l => l.includes('Last update:'));
                if (dateLine) document.getElementById('update-info').innerText = dateLine.replace('#', '').trim();

                // 2. Подписки
                const subResp = await fetch('subscribes.txt' + cacheBuster);
                const subData = await subResp.text();
                const subList = document.getElementById('sub-list');
                subList.innerHTML = '';
                
                subData.split('\n').forEach(line => {
                    if (line.includes('|')) {
                        const p = line.split('|').map(s => s.trim());
                        const title = p[0], link = p[p.length - 1], info = p.slice(1, -1).join('\n');
                        subList.innerHTML += `
                            <div class="item-card sub-item">
                                <span class="item-title">${title}</span>
                                <div class="item-info">${info}</div>
                                <div class="btn-group">
                                    <a href="happ://add/${link}" class="btn btn-accent"><span class="material-icons-outlined">install_mobile</span>Автоимпорт в Happ</a>
                                    <button class="btn btn-secondary" onclick="copyToClipboard('${link}', this)"><span class="material-icons-outlined">content_copy</span>Копировать ссылку</button>
                                </div>
                            </div>`;
                    }
                });

                // 3. Прокси (авто-подстановка описания)
                const proxyResp = await fetch('proxies.txt' + cacheBuster);
                const proxyData = await proxyResp.text();
                const proxyList = document.getElementById('proxy-list');
                proxyList.innerHTML = '';

                proxyData.split('\n').forEach(line => {
                    if (line.includes('|')) {
                        const [name, link] = line.split('|').map(s => s.trim());
                        // Скрипт сам пишет описание, бережём твои пальцы
                        const autoInfo = "Протокол: MTProto"; 
                        
                        proxyList.innerHTML += `
                            <div class="item-card proxy-item">
                                <span class="item-title">${name}</span>
                                <div class="item-info">${autoInfo}</div>
                                <div class="btn-group">
                                    <a href="${link}" class="btn btn-accent"><span class="material-icons-outlined">wifi_tethering</span>Подключить прокси</a>
                                    <button class="btn btn-secondary" onclick="copyToClipboard('${link}', this)"><span class="material-icons-outlined">content_copy</span>Копировать ссылку</button>
                                </div>
                            </div>`;
                    }
                });

            } catch (e) {
                console.log(e);
            }
        }
        fetchData();
    </script>
</body>
</html>
