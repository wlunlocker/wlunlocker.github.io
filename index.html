<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>WLUnlocker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        :root {
            --bg-header: rgba(0, 0, 0, 0.4); 
            --bg-card: rgba(15, 17, 23, 0.7);          
            --bg-btn-dark: rgba(255, 255, 255, 0.08);      
            --bg-btn-light: #e2e4e9;     
            --text-main: #ffffff;
            --text-silver: #e2e4e9;      
            --text-muted: #8e969f;       
            --border-inline: rgba(255, 255, 255, 0.07);
            --font-flex: 'Google Sans Flex', system-ui, sans-serif;
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: var(--font-flex); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; background-color: #000000; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px; text-align: center; background: var(--bg-header); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-inline); display: flex; flex-direction: column; align-items: center; }
        .title-wrapper { width: 100%; max-width: 450px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        h1 { font-size: 1.8rem; font-weight: 700; color: #fff; }
        
        .tab-panel { display: flex; gap: 10px; width: 100%; max-width: 450px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid var(--border-inline); background: rgba(255, 255, 255, 0.05); color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--bg-btn-light); color: #000; }

        .main-scroll { flex: 1; overflow-y: auto; width: 100%; padding: 140px 20px 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .tab-content { display: none; width: 100%; max-width: 450px; opacity: 0; transition: opacity 0.3s ease; }
        .tab-content.active { display: block; opacity: 1; }

        .list-card { background: var(--bg-card); backdrop-filter: blur(15px); border-radius: 24px; padding: 20px; width: 100%; border: 1px solid var(--border-inline); }
        .card-item { display: flex; flex-direction: column; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--border-inline); }
        .card-item:last-child { border-bottom: none; }
        
        .item-meta { display: flex; align-items: center; gap: 16px; }
        .item-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; }
        .item-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .item-title { font-size: 1rem; font-weight: 700; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); }
        
        .item-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .action-btn { padding: 14px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; font-family: var(--font-flex); }
        .btn-main { background: var(--bg-btn-light); color: #000; }
        .btn-secondary { background: var(--bg-btn-dark); color: var(--text-silver); }

        .status-msg { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="title-wrapper">
            <h1>WLUnlocker</h1>
        </div>
        <div class="tab-panel">
            <button class="tab-btn active" onclick="switchTab(this, 'vpn-section')">Подписки</button>
            <button class="tab-btn" onclick="switchTab(this, 'proxy-section')">Прокси</button>
        </div>
    </header>

    <div class="main-scroll" id="content-scroll">
        <div id="vpn-section" class="tab-content active">
            <div id="vpn-list" class="list-card"><div class="status-msg">Загрузка...</div></div>
        </div>
        <div id="proxy-section" class="tab-content">
            <div id="proxy-list" class="list-card"><div class="status-msg">Загрузка...</div></div>
        </div>
    </div>

    <script>
        function switchTab(btn, id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        async function copy(text, btn) {
            await navigator.clipboard.writeText(text);
            const orig = btn.innerText;
            btn.innerText = 'Скопировано';
            setTimeout(() => btn.innerText = orig, 1500);
        }

        async function init() {
            const t = Date.now();
            
            // VPN
            try {
                const res = await fetch('subscribes.txt?t=' + t);
                const data = await res.text();
                document.getElementById('vpn-list').innerHTML = data.split('\n').filter(l => l.includes('|')).map(l => {
                    const [title, link] = l.split('|').map(x => x.trim());
                    return `<div class="card-item"><div class="item-meta"><div class="item-icon"><span class="material-symbols-rounded">security</span></div><div class="item-info"><span class="item-title">${title}</span></div></div><div class="item-actions"><a href="happ://add/${link}" class="action-btn btn-main">Импорт</a><button class="action-btn btn-secondary" onclick="copy('${link}', this)">Копировать</button></div></div>`;
                }).join('');
            } catch(e) { document.getElementById('vpn-list').innerHTML = '<div class="status-msg">Ошибка VPN</div>'; }

            // Proxy
            try {
                const res = await fetch('proxies.txt?t=' + t);
                const data = await res.text();
                document.getElementById('proxy-list').innerHTML = data.split('\n').filter(l => l.includes('|')).map(l => {
                    const [title, link] = l.split('|').map(x => x.trim());
                    return `<div class="card-item"><div class="item-meta"><div class="item-icon"><span class="material-symbols-rounded">dns</span></div><div class="item-info"><span class="item-title">${title}</span></div></div><div class="item-actions"><a href="${link}" class="action-btn btn-main">Telegram</a><button class="action-btn btn-secondary" onclick="copy('${link}', this)">Копировать</button></div></div>`;
                }).join('');
            } catch(e) { document.getElementById('proxy-list').innerHTML = '<div class="status-msg">Ошибка Прокси</div>'; }
        }
        init();
    </script>
</body>
</html>
